[project]
name = "foyergate"
version = "0.1.0.dev0"
description = "An OSS supply chain gateway: vet open-source packages before they enter your local repository."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Denis Pavlov", email = "denimoll@users.noreply.github.com" },
]
keywords = ["security", "supply-chain", "osa", "sca", "sbom", "nexus", "npm"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "redis>=5.3.1",
    "arq>=0.28.0",
    "aioboto3>=15.5.0",
    "structlog>=26.1.0",
    "packageurl-python>=0.17.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.15.0",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "types-redis",
]
docs = [
    "mkdocs-material>=9.8.0",
    "mkdocs-mermaid2-plugin>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/denimoll/foyergate"
Repository = "https://github.com/denimoll/foyergate"
Issues = "https://github.com/denimoll/foyergate/issues"
Changelog = "https://github.com/denimoll/foyergate/blob/main/CHANGELOG.md"

[project.scripts]
foyergate = "foyergate.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foyergate"]

# ──────────────────────────────────────────────────────────────────────────────
# Tool configuration
# ──────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # use of assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --cov=foyergate --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/foyergate"]
branch = true
