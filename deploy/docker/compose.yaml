# ──────────────────────────────────────────────────────────────────────────────
# FoyerGate — local evaluation stack
#
#   Run from the repository root:
#       docker compose -f deploy/docker/compose.yaml up -d
#
#   Services:
#     api       — FoyerGate API (FastAPI on :9876)
#     postgres  — primary state
#     redis     — cache + arq queue
#     minio     — S3-compatible quarantine storage
#     opa       — policy engine (starts empty; load policies via API or volume)
#
#   The API is built from this repository. For production, pin a published
#   image digest instead of building locally.
# ──────────────────────────────────────────────────────────────────────────────

name: foyergate

x-restart: &restart
  restart: unless-stopped

services:
  api:
    <<: *restart
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: foyergate:dev
    env_file: ../../.env
    environment:
      FOYERGATE_DB_DSN: postgresql+asyncpg://foyergate:foyergate@postgres:5432/foyergate
      FOYERGATE_REDIS_URL: redis://redis:6379/0
      FOYERGATE_S3_ENDPOINT: http://minio:9000
      FOYERGATE_OPA_URL: http://opa:8181
    ports:
      - "9876:9876"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opa:
        condition: service_started

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foyergate
      POSTGRES_PASSWORD: foyergate
      POSTGRES_DB: foyergate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foyergate -d foyergate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *restart
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foyergate
      MINIO_ROOT_PASSWORD: changeme-in-production
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  opa:
    <<: *restart
    image: openpolicyagent/opa:latest-rootless
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
    ports:
      - "8181:8181"

volumes:
  postgres-data:
  redis-data:
  minio-data:
